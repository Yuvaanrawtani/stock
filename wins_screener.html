</style></head><body><main>
<h1>📈 WInS Screener</h1><div class="mu" id="hd"></div>
<div class="tabs" id="tabs"></div><div id="v"></div>
</main>
<script>
const MK=["last_close","daily_return","monthly_return","ann_return","cagr","volatility","beta","alpha","sharpe","max_drawdown","correlation","r_squared"];
const GRP={stock:["market_cap","pe_ratio","dividend_yield","eps","profit_margin","roe","sector","news_sentiment","news_count"],etf:["expense_ratio","aum","news_sentiment","news_count"],bond:["bond_yield","bond_duration","bond_maturity","news_sentiment","news_count"]};
const EXTRA=new Set(Object.values(GRP).flat());
const PCT=new Set(["daily_return","monthly_return","ann_return","cagr","volatility","alpha","max_drawdown","dividend_yield","profit_margin","roe","expense_ratio"]);
const NA="N/A — unavailable from current provider.";
const EQ="ARKK GRID FAN PAVE TAN PHO PBW IBB DGRO ESGU ICLN INDA EWW EWT ITA BBCA XLU ESGV VWO VHT VNQ VTI VT VSS VNQI MSOS IPO JEPI COWZ LQCL XLC XLP XLE XLF XLV XLI RSP ESGE EWA EWZ MCHI DSI USMV QUAL ESGD MOAT VEU VEA VGK VOO VXUS XLB XLY QQQ MTUM IWF XLK SMH VUG VGT IWD NOBL SCHD VIG VYM VTV IJH VO IJR IWM AVUV".split(" "),FI="AGG JPST BSV BND BNDX FTSL HYLS IGSB FALN HYG LQD JNK VCIT VCSH SHY TLT IEF EMB SHV GOVT BIL VGSH USFR EMLC VTIP TIP MBB MUB VTEB".split(" ");
const cls=a=>{a=(a||"").toLowerCase();return/etf|fund/.test(a)?"etf":/bond|fixed/.test(a)?"bond":"stock"};
const exp=u=>MK.concat(GRP[cls(u.c)]);
const lab=(p,s,d)=>p>=.9&&!s&&!d?"HIGH CONFIDENCE":p>=.5?"PARTIAL DATA":"INSUFFICIENT DATA";
const lc=l=>l[0]==="H"?"HIGH":l[0]==="P"?"PARTIAL":"INSUF";
const mean=x=>x.reduce((s,v)=>s+v,0)/x.length;
const cov=(x,y)=>{const a=mean(x),b=mean(y);return x.reduce((s,v,i)=>s+(v-a)*(y[i]-b),0)/(x.length-1)};
const now=()=>new Date().toISOString().slice(0,19)+"Z";
const mkS=()=>({u:[],px:{},src:{},at:{},ex:{},cfg:{rf:.04,bench:"SPY",lb:1095},last:null,log:[],rej:0,dupU:0,dupP:0,ml:null,sample:false,
 w:{sharpe:.3,cagr:.2,alpha:.1,volatility:.2,max_drawdown:.2},f:{a:{},lo:{},hi:{},q:""},dec:{},pw:{},sel:"",xt:"Report outline",
 fc:{r:.05,sd:.10,inf:.025,rf:.03,idx:false,n:5000},
 sc:[{n:"Base case",dr:0,sy:2029,sr:0},{n:"Low return",dr:-.03,sy:2029,sr:0},{n:"High volatility",dr:-.01,sy:2030,sr:-.2},{n:"Equity drawdown",dr:0,sy:2029,sr:-.35},{n:"Recession",dr:-.01,sy:2031,sr:-.25},{n:"High inflation",dr:0,sy:2029,sr:0,inf:.06,idx:true},{n:"Interest-rate shock",dr:-.01,sy:2028,sr:-.12},{n:"Combined stress",dr:-.03,sy:2032,sr:-.35,inf:.06,idx:true}]});
let S=mkS(),tab="Data";
try{const x=localStorage.getItem("wins2");if(x)S=Object.assign(mkS(),JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("wins2",JSON.stringify(S))}catch(e){}};
// ---------- data layer ----------
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const gz=r=>Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r());
function demoPx(t){const mk=rng(42),r=rng(hash(t)),sp=t==="SPY",beta=sp?1:.4+r()*1.2,iv=sp?.0005:.006+r()*.006;let p=50+r()*200,d=new Date(Date.UTC(2025,11,31));const days=[];
 while(days.length<800){if(d.getUTCDay()%6)days.push(d.toISOString().slice(0,10));d=new Date(d-864e5)}
 return days.reverse().map(x=>[x,+(p*=1+beta*(.0004+.01*gz(mk))+iv*gz(r)).toFixed(4)])}
function clean(rows){const m=new Map();for(const[d,p]of rows){const x=+p,ds=String(d).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)||!(x>0)||!isFinite(x)){S.rej++;continue}if(m.has(ds))S.dupP++;m.set(ds,x)}return[...m].sort((a,b)=>a[0]<b[0]?-1:1)}
const csv=t=>{const L=t.trim().split(/\r?\n/).map(l=>l.split(",").map(x=>x.trim().replace(/^"|"$/g,"")));return{h:L[0].map(x=>x.toLowerCase()),r:L.slice(1)}};
const col=(h,n)=>n.map(x=>h.indexOf(x)).find(i=>i>=0);
function setUniverse(rows){S.u=[];S.ex={};S.dupU=0;const seen=new Set();
 for(const r of rows){const t=(r.t||"").toUpperCase();if(!t)continue;if(seen.has(t)){S.dupU++;continue}seen.add(t);S.u.push({t,n:r.n||"",c:r.c||"",a:r.a||{}});if(r.x)S.ex[t]=r.x}S.at._u=now();S.sample=false;S.dec={};S.pw={};S.sel=""}
function loadUniverse(text){const{h,r}=csv(text),ti=col(h,["ticker","symbol"]),ni=col(h,["name","security name"]),ci=col(h,["asset_class","asset class"]);
 if(ti==null)return log("Universe CSV needs a ticker (or symbol) column.");
 setUniverse(r.map(x=>{const e={},a={};h.forEach((k,i)=>{if(x[i]===""||x[i]==null)return;if(EXTRA.has(k))e[k]=isNaN(+x[i])?x[i]:+x[i];else if(![ti,ni,ci].includes(i))a[k]=x[i]});return{t:x[ti],n:ni!=null?x[ni]:"",c:ci!=null?x[ci]:"",x:e,a}}));
 log("Loaded universe: "+S.u.length+" securities, "+S.dupU+" duplicates skipped.");save();draw()}
function loadPrices(text){const{h,r}=csv(text),by={};S.rej=0;S.dupP=0;
 const ti=col(h,["ticker","symbol"]),di=col(h,["date"]),pi=col(h,["close","adj close","price"]);
 if(ti!=null&&di!=null&&pi!=null)r.forEach(x=>(by[x[ti].toUpperCase()]=by[x[ti].toUpperCase()]||[]).push([x[di],x[pi]]));
 else if(h[0]==="date")h.slice(1).forEach((t,j)=>by[t.toUpperCase()]=r.map(x=>[x[0],x[j+1]]));
 else return log("Prices CSV: use columns ticker,date,close  OR  date,TICKER1,TICKER2,… (dates as YYYY-MM-DD).");
 for(const t in by){S.px[t]=clean(by[t]);S.src[t]="upload";S.at[t]=now()}
 log("Loaded prices for "+Object.keys(by).length+" tickers; rejected "+S.rej+" invalid rows.");save();draw()}
function loadDemo(){setUniverse([...EQ.map(t=>({t,n:"",c:"Equity ETF"})),...FI.map(t=>({t,n:"",c:"Fixed Income ETF"}))]);S.sample=true;S.px={};S.rej=0;S.dupP=0;S.ml=null;
 for(const t of [...S.u.map(u=>u.t),"SPY"]){S.px[t]=demoPx(t);S.src[t]="demo";S.at[t]=now()}S.last=now();log("Sample loaded: your 100 tickers (names/countries/sectors NOT included — upload your full table for those). Prices are SYNTHETIC demo data ending 2025-12-31.");save();draw()}
function refresh(){const L=["1. Read universe: "+S.u.length+" securities"];let d=0,k=0;
 for(const u of S.u){if(S.src[u.t]==="demo"){S.px[u.t]=demoPx(u.t);S.at[u.t]=now();d++}else if(S.px[u.t])k++}
 if(S.src.SPY==="demo"){S.px.SPY=demoPx("SPY");S.at.SPY=now()}L.push("2-3. No live provider can be called from a web page. Demo series regenerated: "+d+"; uploaded series kept as-is: "+k+"; no data (N/A): "+(S.u.length-d-k));
 L.push("4-7. Validated, normalized and recalculated metrics from cached prices.","8. Screening table updated.","9. Timestamp recorded: "+now());S.last=now();S.log=L;save();draw()}
function log(m){S.log=[m];draw()}
function compute(a,b,rf,lb){if(!a||!b||!a.length||!b.length)return null;
 const cut=new Date(new Date(a[a.length-1][0])-lb*864e5).toISOString().slice(0,10),A=new Map(a.filter(x=>x[0]>=cut)),B=new Map(b.filter(x=>x[0]>=cut)),D=[...A.keys()].filter(d=>B.has(d)).sort();
 if(D.length<60)return null;const ar=[],br=[];for(let i=1;i<D.length;i++){ar.push(A.get(D[i])/A.get(D[i-1])-1);br.push(B.get(D[i])/B.get(D[i-1])-1)}
 const aa=mean(ar)*252,ab=mean(br)*252,va=cov(ar,ar),vb=cov(br,br),cv=cov(ar,br),vol=Math.sqrt(va*252),beta=vb>0?cv/vb:null,corr=va>0&&vb>0?cv/Math.sqrt(va*vb):null,yrs=(new Date(D[D.length-1])-new Date(D[0]))/3.15576e10;
 let pk=0,dd=0;const mo={};for(const d of D){const v=A.get(d);pk=Math.max(pk,v);dd=Math.min(dd,v/pk-1);mo[d.slice(0,7)]=v}const m=Object.values(mo);
 return{v:{daily_return:ar[ar.length-1],monthly_return:m.length>1?m[m.length-1]/m[m.length-2]-1:null,ann_return:aa,cagr:yrs>0?Math.pow(A.get(D[D.length-1])/A.get(D[0]),1/yrs)-1:null,volatility:vol,beta,alpha:beta==null?null:aa-(rf+beta*(ab-rf)),sharpe:vol>0?(aa-rf)/vol:null,max_drawdown:dd,correlation:corr,r_squared:corr==null?null:corr*corr},p:D[0]+".."+D[D.length-1]}}
function dps(){const out={};for(const u of S.u){const t=u.t,o=out[t]={},px=S.px[t],src=S.src[t]||"",st=src==="demo"?"DEMO":"OK";
 if(px&&px.length){o.last_close={v:px[px.length-1][1],st,at:S.at[t]};const c=compute(px,S.px[S.cfg.bench],S.cfg.rf,S.cfg.lb);if(c)for(const k in c.v)if(c.v[k]!=null&&isFinite(c.v[k]))o[k]={v:c.v[k],st,at:S.at[t]}}
 for(const k in S.ex[t]||{})o[k]={v:S.ex[t][k],st:"OK",at:S.at._u};
 if(S.ml&&S.ml.s[t]!=null)o.ml_score={v:S.ml.s[t],st:S.ml.demo?"DEMO":"OK",at:S.ml.at}}return out}
function quality(D){const rows=S.u.map(u=>{const o=D[u.t],e=exp(u),miss=e.filter(k=>!o[k]),p=1-miss.length/e.length,at=Object.values(o).map(x=>x.at).filter(Boolean).sort().pop(),
 stale=!at||(Date.now()-new Date(at))/864e5>7,demo=Object.values(o).some(x=>x.st==="DEMO");return{t:u.t,p,miss,stale,demo,l:lab(p,stale,demo)}});
 const avg=rows.length?mean(rows.map(r=>r.p)):0;return{rows,avg,all:rows.length?lab(avg,rows.some(r=>r.stale),rows.some(r=>r.demo)):"INSUFFICIENT DATA"}}
// ---------- ML (ridge, walk-forward) ----------
const rank=a=>{const o=a.map((v,i)=>i).sort((x,y)=>a[x]-a[y]),r=[];o.forEach((i,k)=>r[i]=k);return r};
const spear=(a,b)=>{const x=rank(a),y=rank(b);return cov(x,y)/Math.sqrt(cov(x,x)*cov(y,y))};
function ridge(tr,al){const n=9,A=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?al:0)),b=Array(n).fill(0);
 for(const r of tr)for(let i=0;i<n;i++){b[i]+=r.x[i]*r.y;for(let j=0;j<n;j++)A[i][j]+=r.x[i]*r.x[j]}
 for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
  for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
 const w=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let j=i+1;j<n;j++)s-=A[i][j]*w[j];w[i]=s/A[i][i]}return w}
const dot=(w,x)=>w.reduce((s,v,i)=>s+v*x[i],0);
function summ(ic,sp){ic=ic.filter(isFinite);const n=ic.length;if(n<6)return{n,verdict:"INSUFFICIENT DATA"};const sd=Math.sqrt(cov(ic,ic)),t=mean(ic)/(sd/Math.sqrt(n)+1e-12);
 return{n,ic:mean(ic).toFixed(3),t:t.toFixed(2),hit:(ic.filter(x=>x>0).length/n*100).toFixed(0)+"%",sp:(mean(sp)*100).toFixed(2)+"%",verdict:t>=2?"SIGNAL (t≥2)":"NO SIGNIFICANT EDGE (t<2)"}}
function train(){const B=S.px[S.cfg.bench],uni=S.u.filter(u=>u.t!==S.cfg.bench&&S.px[u.t]&&cls(u.c)!=="bond");
 if(!B||uni.length<6)return{err:"Need benchmark prices plus at least 6 securities with prices."};
 const D=B.map(x=>x[0]),bp=B.map(x=>x[1]),P={};
 for(const u of uni){const m=new Map(S.px[u.t]);let l=null;P[u.t]=D.map(d=>{if(m.has(d))l=m.get(d);return l})}
 const me=[];D.forEach((d,i)=>{if(i===D.length-1||D[i+1].slice(0,7)!==d.slice(0,7))me.push(i)});
 if(me.length<24)return{err:"Need about 3 years of daily prices."};
 const rows=[];
 for(let k=12;k<me.length;k++){const i=me[k],rb=[];for(let j=i-125;j<=i;j++)rb.push(bp[j]/bp[j-1]-1);const vb=cov(rb,rb),cr=[];
  for(const u of uni){const a=P[u.t];if(a[me[k-12]]==null||a[i-126]==null)continue;const r=[];for(let j=i-125;j<=i;j++)r.push(a[j]/a[j-1]-1);
   const f=j=>a[i]/a[me[k-j]]-1,w=a.slice(i-125,i+1);let pk=0,dd=0;for(const v of w){pk=Math.max(pk,v);dd=Math.min(dd,v/pk-1)}
   cr.push({k,t:u.t,x:[f(1),f(3),f(6),f(12),Math.sqrt(cov(r.slice(-63),r.slice(-63))*252),cov(r,rb)/vb,dd,f(3)-(bp[i]/bp[me[k-3]]-1),a[i]/pk-1],
    y:k+1<me.length?(a[me[k+1]]/a[i]-1)-(bp[me[k+1]]/bp[i]-1):null})}
  if(cr.length<6)continue;
  for(let f=0;f<9;f++){const c=cr.map(r=>r.x[f]),m=mean(c),s=Math.sqrt(cov(c,c))+1e-9;cr.forEach(r=>r.x[f]=(r.x[f]-m)/s)}
  if(cr[0].y!=null){const m=mean(cr.map(r=>r.y));cr.forEach(r=>r.y-=m)}rows.push(...cr)}
 const by={};rows.forEach(r=>(by[r.k]=by[r.k]||[]).push(r));const ks=Object.keys(by).map(Number).sort((a,b)=>a-b),ok=ks.filter(k=>by[k][0].y!=null),R={ridge:{ic:[],sp:[]},baseline_mom6:{ic:[],sp:[]}};
 for(const k of ok.slice(15)){const te=by[k],tr=ok.filter(j=>j<k).flatMap(j=>by[j]),w=ridge(tr,10),y=te.map(r=>r.y);
  for(const[n,s]of[["ridge",te.map(r=>dot(w,r.x))],["baseline_mom6",te.map(r=>r.x[2])]]){R[n].ic.push(spear(s,y));const o=s.map((v,i)=>i).sort((a,b)=>s[a]-s[b]),q=Math.max(1,te.length/3|0);R[n].sp.push(mean(o.slice(-q).map(i=>y[i]))-mean(o.slice(0,q).map(i=>y[i])))}}
 const w=ridge(ok.flatMap(k=>by[k]),10),sc={};(by[ks[ks.length-1]]||[]).filter(r=>r.y==null).forEach(r=>sc[r.t]=+dot(w,r.x).toFixed(6));
 const demo=uni.some(u=>S.src[u.t]==="demo");
 return{s:sc,at:now(),demo,date:D[D.length-1],rep:{ridge:summ(R.ridge.ic,R.ridge.sp),baseline_mom6:summ(R.baseline_mom6.ic,R.baseline_mom6.sp)}}}

const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const LOW=new Set(["volatility"]),FK=["sharpe","cagr","volatility","beta","max_drawdown","expense_ratio","pe_ratio","dividend_yield"];
const attr=(u,k)=>k==="asset_class"?u.c:(u.a||{})[k]||"";
const INFO={sharpe:"What: return per unit of risk. Formula: (return − risk-free) ÷ volatility. High: better risk-adjusted past results. Low: little reward for the risk taken. Why: compares funds with different risk. Not a buy signal alone.",
volatility:"What: how much returns swing (annualized std. dev.). High: bumpier ride. Low: steadier. Why: Laura needs cash on fixed dates.",
beta:"What: sensitivity to the benchmark (cov ÷ benchmark variance). >1 moves more than the market, <1 less. Why: shows market dependence.",
max_drawdown:"What: worst peak-to-trough fall. Closer to 0% = milder. Why: shows the worst pain in the sample.",
cagr:"What: compound annual growth rate = (end ÷ start)^(1/years) − 1. High: faster past growth. Low: slower. Says nothing certain about the future.",
alpha:"What: return beyond what beta to the benchmark explains. High: beat the benchmark for its risk. Low/negative: lagged. Noisy over short windows."};
function score(D){const ks=Object.keys(S.w),rg={};for(const k of ks){const v=S.u.map(u=>D[u.t][k]&&D[u.t][k].v).filter(x=>x!=null);rg[k]=[Math.min(...v),Math.max(...v)]}
 const o={};for(const u of S.u){const rows=[];let tw=0,sum=0;for(const k of ks){const c=D[u.t][k],w=+S.w[k];if(!c||!(w>0)||!isFinite(rg[k][0]))continue;const[a,b]=rg[k];let n=b>a?(c.v-a)/(b-a)*100:50;if(LOW.has(k))n=100-n;rows.push({k,raw:c.v,n,w});tw+=w}
  rows.forEach(r=>{r.wn=r.w/tw;r.c=r.n*r.wn;sum+=r.c});o[u.t]={s:rows.length?sum:null,rows,miss:ks.filter(k=>!rows.find(r=>r.k===k))}}return o}
function funnel(D,SC){const st=[];let L=S.u.slice();const add=(n,f)=>{const k=L.filter(f);st.push({n,a:L.length,r:L.length-k.length});L=k};
 add("WInS universe",()=>true);
 add("Class / country / sector / theme filters",u=>Object.entries(S.f.a).every(([k,v])=>!v||attr(u,k)===v)&&(!S.f.q||(u.t+" "+u.n).toLowerCase().includes(S.f.q.toLowerCase())));

  <div class="card sc"><table><tr><th>Ticker</th><th>Complete</th><th>Status</th><th>Missing metrics</th></tr>${Q.rows.map(r=>`<tr><td>${r.t}</td><td>${(r.p*100).toFixed(0)}%</td><td><span class="b ${lc(r.l)}">${r.l}</span></td><td style="white-space:normal;text-align:left">${r.miss.join(", ")||"—"}</td></tr>`).join("")}</table></div>
  <div class="mu">Demo data can never reach HIGH CONFIDENCE. Source conflicts need 2+ providers (only one source is possible in this web version).</div>`}
 if(tab==="ML model"){const m=S.ml;h=ban(Q.all)+`<div class="card"><div class="mu">Ridge regression ranks securities by predicted next-month return vs the average security. Validated walk-forward (trains only on the past) and compared with a "buy 6-month winners" baseline.</div>
  <div class="row"><button class="pri" onclick="runML()">Train model</button></div>${S.mlerr?`<div class="INSUF">${S.mlerr}</div>`:""}</div>`;
  if(m)h+=`<div class="card sc"><b>Walk-forward results</b> <span class="mu">(${m.demo?"SYNTHETIC demo data":"your data"}, trained ${m.at})</span><table><tr><th>Model</th><th>Months</th><th>Mean IC</th><th>t-stat</th><th>Hit rate</th><th>Top−bottom / mo</th><th>Verdict</th></tr>
  ${Object.entries(m.rep).map(([k,r])=>`<tr><td>${k}</td><td>${r.n}</td><td>${r.ic||"—"}</td><td>${r.t||"—"}</td><td>${r.hit||"—"}</td><td>${r.sp||"—"}</td><td>${r.verdict}</td></tr>`).join("")}</table></div>
  <div class="mu">Trust ml_score only if the ridge verdict says SIGNAL. IC = rank correlation between prediction and what actually happened.</div>`}
 $v.innerHTML=h}
